<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Một trang web đơn giản giúp bạn tra 
    cứu các tệp tin phù hợp với từng giả 
    lập có trong máy chơi game cầm tay 
    TRIMUI BRICK PRO.">
    <title>TrimUI Brick Pro - ROM Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-89TNR8YBLQ"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-89TNR8YBLQ');
</script>
<body>
    <div class="tree-container">
        <h3 class="title">📁 Cấu trúc thư mục Rom - TrimUI Brick Pro</h3>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-tree')">📑 Roms folder tree</button>
            <button class="tab-btn" onclick="switchTab('tab-cards')">🗂️ Folder cards view</button>
        </div>

        <!-- Tab 1: Tree View -->
        <div id="tab-tree" class="tab-content active">
            <div id="rom-tree">Đang tải dữ liệu từ Google Sheet...</div>
        </div>

        <!-- Tab 2: Cards View -->
        <div id="tab-cards" class="tab-content">
            <div id="rom-cards" class="cards-grid">Đang tải dữ liệu từ Google Sheet...</div>
        </div>
    </div>

    <script>
        const sheetID = '1mJiP3IOBUEbPFKa7I2FNnhqp4SJZhtQpnE9ScgrBdI0';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv`;

        // Logic chuyển Tab
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('active');
        }

        // Logic mở Expander từ Card View
        function openTreeItem(index) {
            switchTab('tab-tree');
            const detailsEl = document.getElementById(`tree-item-${index}`);
            if (detailsEl) {
                detailsEl.open = true;
                // Cuộn mượt mà tới vị trí của thẻ details để người dùng dễ nhìn
                detailsEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function formatDriveImageUrl(urlOrId) {
            if (!urlOrId || urlOrId.trim() === '' || urlOrId.toLowerCase() === 'yes') return '';
            const str = urlOrId.trim();
            const driveMatch = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
            }
            if (!str.startsWith('http')) {
                return `https://lh3.googleusercontent.com/d/${str}`;
            }
            return str;
        }

        function parseCSVLine(text) {
            const result = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    result.push(cell.trim().replace(/^"|"$/g, ''));
                    cell = '';
                } else {
                    cell += c;
                }
            }
            result.push(cell.trim().replace(/^"|"$/g, ''));
            return result;
        }

        fetch(csvUrl)
            .then(response => {
                if (!response.ok) throw new Error('Không thể tải dữ liệu');
                return response.text();
            })
            .then(csvText => {
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                const rows = lines.slice(1);

                // BƯỚC 1: LƯU TẤT CẢ DỮ LIỆU VÀO MẢNG
                let parsedData = rows.map((row, originalIndex) => {
                    const cols = parseCSVLine(row);
                    if (cols.length < 2) return null;

                    const isEmulatorRaw = (cols[6] || '').trim().toUpperCase();
                    const isEmulator = isEmulatorRaw === 'TRUE' || isEmulatorRaw === 'YES';

                    const yearRaw = (cols[7] || '').trim();
                    const yearNum = parseInt(yearRaw);

                    return {
                        idIndex: originalIndex, // Giữ ID gốc để scroll
                        consoleName: cols[0] || '',
                        folderName: cols[1] || '',
                        rawExt: cols[2] || '',
                        pictureRaw: cols[3] || '',
                        webLink: cols[4] || '',
                        description: cols[5] || '',
                        isEmulator: isEmulator,
                        yearStr: yearRaw,
                        sortYear: isNaN(yearNum) ? 9999 : yearNum
                    };
                }).filter(item => item !== null);

                // BƯỚC 2: SẮP XẾP MẢNG
                parsedData.sort((a, b) => a.sortYear - b.sortYear);

                // BƯỚC 3: XUẤT RA HTML (Cho cả Tree và Cards)
                let htmlTree = '';
                let htmlCards = '';

                parsedData.forEach(item => {
                    // Cấu trúc Data Huy hiệu (Badge)
                    const extensions = item.rawExt ? item.rawExt
                        .split('|')
                        .filter(ext => ext.length !== 0)
                        .map(ext => `<span class="ext-badge">${ext.trim()}</span>`).join('')
                        : '<span style="color:#9ca3af; font-style:italic;">Không yêu cầu</span>';

                    const imgUrl = formatDriveImageUrl(item.pictureRaw);
                    const typeBadgeHtml = item.isEmulator
                        ? `<span class="type-badge emulator-badge">⚙️ Giả lập</span>`
                        : `<span class="type-badge console-badge">🎮 Dòng máy</span>`;
                    const yearBadgeHtml = item.yearStr
                        ? `<span class="year-badge">${item.yearStr}</span>`
                        : '';

                    // 1. Dựng giao diện Tree (Tab 1)
                    htmlTree += `
                    <details class="folder-item" id="tree-item-${item.idIndex}">
                        <summary class="folder-header">
                            <span class="arrow-icon">▶</span>
                            📂&nbsp;<span class="folder-path">Roms/${item.folderName}</span>
                            
                            <div class="header-right-info">
                                <span class="console-name">${item.consoleName}</span>
                                ${yearBadgeHtml}
                                ${typeBadgeHtml}
                            </div>
                        </summary>
                        <div class="details-body">
                            <div><strong>Đuôi file hợp lệ:</strong> ${extensions}</div>
                            
                            ${(item.description || imgUrl) ? `
                            <div class="content-wrapper">
                                ${imgUrl ? `
                                    <div class="img-box">
                                        <img src="${imgUrl}" alt="${item.consoleName}" loading="lazy" onerror="this.parentElement.style.display='none'">
                                    </div>
                                ` : ''}
                                
                                <div class="desc-box">
                                    ${item.description ? `<div>${item.description}</div>` : ''}
                                    ${item.webLink ? `<div><a href="${item.webLink}" target="_blank" class="web-link-btn">🌐 Xem tài liệu / Chi tiết ➔</a></div>` : ''}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </details>
                    `;

                    // 2. Dựng giao diện Cards (Tab 2)
                    // Image fallback xử lý lỗi ảnh tự động ẩn theo quy chuẩn[cite: 4]
                    htmlCards += `
                    <div class="card" onclick="openTreeItem(${item.idIndex})">
                        <div class="card-img-wrapper">
                            ${imgUrl ? `<img src="${imgUrl}" alt="${item.consoleName}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder-icon\\'>🎮</div>'">` : `<div class="placeholder-icon">📁</div>`}
                        </div>
                        <div class="card-body">
                            <div class="card-title">${item.consoleName || item.folderName}</div>
                            <div class="card-badges">
                                ${yearBadgeHtml}
                                ${typeBadgeHtml}
                            </div>
                            <div class="card-folder">/roms/${item.folderName}</div>
                        </div>
                    </div>
                    `;
                });

                document.getElementById('rom-tree').innerHTML = htmlTree || 'Không tìm thấy dữ liệu.';
                document.getElementById('rom-cards').innerHTML = htmlCards || 'Không tìm thấy dữ liệu.';
            })
            .catch(err => {
                console.error('Lỗi:', err);
                document.getElementById('rom-tree').innerHTML = '<span style="color:red;">Lỗi kết nối dữ liệu từ Google Sheet.</span>';
                document.getElementById('rom-cards').innerHTML = '<span style="color:red;">Lỗi kết nối dữ liệu.</span>';
            });
    </script>

</body>

</html>
